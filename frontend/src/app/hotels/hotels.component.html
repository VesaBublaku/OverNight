<app-header></app-header>

<!-- Header Section (White background) -->
<section class="bg-white pt-12 pb-8 px-4 border-b border-gray-100">
  <div class="max-w-[85rem] mx-auto sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row md:items-start justify-between gap-6 mb-8">
      <div>
        <div class="text-[10px] font-semibold text-gray-400 tracking-[0.3em] uppercase mb-4">Hotels</div>
        <h1 class="text-4xl md:text-5xl font-serif text-gray-900 mb-3">Explore hotels in style.</h1>
        <p class="text-gray-500 text-sm font-light max-w-xl">Browse properties by city and brand — then open a hotel to see details and rooms.</p>
      </div>

    </div>

    <div class="flex flex-col md:flex-row items-center gap-4">
      <div class="w-full md:flex-1">
        <input type="text" placeholder="Search hotels..." class="w-full border border-gray-200 rounded-full px-5 py-2.5 text-sm font-light focus:outline-none focus:border-[#BCA47B] transition-colors placeholder-gray-400" />
      </div>
      <div class="w-full md:w-64">
        <select class="w-full bg-white border border-gray-200 rounded-full px-5 py-2.5 text-sm text-gray-700 font-light focus:outline-none focus:border-[#BCA47B] transition-colors appearance-none cursor-pointer">
          <option>All</option>
        </select>
      </div>
      <div class="w-full md:w-auto">
        <button class="w-full bg-white border border-gray-200 hover:border-gray-300 text-gray-400 rounded-full px-6 py-2.5 text-[10px] font-semibold tracking-[0.15em] uppercase transition-colors">
          Clear Filters
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Main Content Grid (Beige background) -->
<section class="bg-[#FAF8F5] min-h-screen py-12 px-4">
  <div class="max-w-[85rem] mx-auto sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <div *ngFor="let hotel of hotels" class="bg-white rounded-[1.5rem] shadow-[0_4px_24px_rgb(0,0,0,0.03)] overflow-hidden border border-gray-50 flex flex-col h-full">
        <!-- Image Area -->
        <div class="relative h-48 w-full shrink-0">
          <img [src]="hotel.image" class="w-full h-full object-cover" />
          <!-- Gradient Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

          <!-- Content over image -->
          <div class="absolute bottom-5 left-5 right-5">
            <h3 class="text-xl font-serif text-white mb-1 drop-shadow-md">{{hotel.title}}</h3>
            <div class="text-[10px] font-semibold text-gray-300 tracking-[0.2em] uppercase">{{hotel.city}}</div>
          </div>
        </div>

        <!-- Bottom Info Area -->
        <div class="p-6 flex flex-col flex-grow">
          <p class="text-sm text-gray-500 font-light mb-8">{{hotel.address}}</p>

          <div class="mt-auto flex items-center justify-between pt-2">
            <button class="bg-white border border-gray-200 hover:border-gray-300 text-gray-900 rounded-full px-4 py-2 text-[9px] font-semibold tracking-[0.15em] uppercase transition-colors">
              View Details
            </button>
            <a href="#" class="text-gray-400 hover:text-gray-900 text-[9px] font-semibold tracking-[0.15em] uppercase transition-colors flex items-center gap-1.5">
              Rooms <span>&rsaquo;</span>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<app-footer></app-footer>
